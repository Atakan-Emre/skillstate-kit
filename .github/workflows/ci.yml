name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run ruff check src tests examples scripts
      - run: uv run ruff format --check src tests examples scripts
      - run: uv run pytest --cov=skillstate --cov-fail-under=85 --cov-report=term-missing
      - run: uv run python examples/managed_runtime.py
      - run: uv run skillstate demo
  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv export --locked --all-extras --no-emit-project --no-hashes --format requirements-txt --output-file audit-requirements.txt
      - run: uvx --from pip-audit==2.10.1 pip-audit --requirement audit-requirements.txt --no-deps --disable-pip
      - run: uv run python -m build
      - run: uv run twine check dist/*
      - run: uv run python scripts/check_wheel.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
